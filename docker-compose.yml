services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-daily_planner}
      POSTGRES_USER: ${POSTGRES_USER:-daily_planner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  app:
    build: .
    environment: &planner_environment
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:-daily_planner}
      PGUSER: ${POSTGRES_USER:-daily_planner}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      PLANNER_PASSWORD: ${PLANNER_PASSWORD:?Set PLANNER_PASSWORD in .env}
      HOST: 0.0.0.0
      PORT: 8000
      RUN_MIGRATIONS: "1"
      DEV_AUTO_RELOAD: "1"
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped

  mcp:
    build: .
    environment:
      <<: *planner_environment
      HOST: 0.0.0.0
      PORT: 8001
      MCP_TUNNEL_MODE: "1"
      RUN_MIGRATIONS: "0"
    ports:
      - "127.0.0.1:8001:8001"
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/healthz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres_data:
